<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>内容管理后台 - Firefly</title>
  <link rel="stylesheet" href="/vendor/toastui/toastui-editor.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" title="菜单" aria-label="菜单">☰</button>
    <div class="brand">
      <span class="logo">🔥</span>
      <span class="title">Firefly</span>
      <span class="sub">内容管理系统</span>
    </div>
    <div class="top-divider"></div>
    <div class="repo-info" id="repoInfo"></div>
    <nav class="top-nav" id="topNav" aria-label="主导航">
      <button class="nav-btn active" type="button" data-type="posts"><span class="ni-ico">📝</span><span class="ni-tx">文章内容</span></button>
      <button class="nav-btn" type="button" data-type="dynamic"><span class="ni-ico">⚡</span><span class="ni-tx">我的动态</span></button>
      <button class="nav-btn" type="button" data-type="spec"><span class="ni-ico">📄</span><span class="ni-tx">页面信息</span></button>
      <button class="nav-btn" type="button" data-type="gallery"><span class="ni-ico">🖼️</span><span class="ni-tx">图库素材</span></button>
      <button class="nav-btn" type="button" data-type="config"><span class="ni-ico">⚙️</span><span class="ni-tx">基础配置</span></button>
      <button class="nav-btn" type="button" data-type="cfgfunc"><span class="ni-ico">🧩</span><span class="ni-tx">功能配置</span></button>
      <button class="nav-btn" type="button" data-type="cfgpage"><span class="ni-ico">📑</span><span class="ni-tx">页面配置</span></button>
      <button class="nav-btn" type="button" data-type="cfgext"><span class="ni-ico">🧪</span><span class="ni-tx">扩展功能</span></button>
    </nav>
    <div class="top-actions">
      <div class="qr-icon" title="WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        <div class="qr-tooltip"><img src="/uploads/qr-whatsapp.jpg" alt="WhatsApp 二维码" /></div>
      </div>
      <div class="qr-icon" title="Telegram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0Zm4.962 7.224c.1-.002.321.023.465.141a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635Z"/></svg>
        <div class="qr-tooltip"><img src="/uploads/qr-telegram.jpg" alt="Telegram 二维码" /></div>
      </div>
      <button id="logoutBtn" class="btn ghost" hidden>退出登录</button>
    </div>
  </header>

  <!-- 移动端抽屉遮罩 -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <!-- 主区域 -->
  <main class="layout" id="mainApp" hidden>
    <!-- 左侧栏：移动端抽屉一级导航 / PC 端二级菜单 -->
    <aside class="sidebar" id="sidebar">
      <!-- 移动端抽屉内的一级导航（PC 隐藏） -->
      <nav class="nav-bar" id="navBar" aria-label="主导航">
        <button class="nav-btn active" type="button" data-type="posts"><span class="ni-ico">📝</span><span class="ni-tx">文章内容</span></button>
        <button class="nav-btn" type="button" data-type="dynamic"><span class="ni-ico">⚡</span><span class="ni-tx">我的动态</span></button>
        <button class="nav-btn" type="button" data-type="spec"><span class="ni-ico">📄</span><span class="ni-tx">页面信息</span></button>
        <button class="nav-btn" type="button" data-type="gallery"><span class="ni-ico">🖼️</span><span class="ni-tx">图库素材</span></button>
        <button class="nav-btn" type="button" data-type="config"><span class="ni-ico">⚙️</span><span class="ni-tx">基础配置</span></button>
        <button class="nav-btn" type="button" data-type="cfgfunc"><span class="ni-ico">🧩</span><span class="ni-tx">功能配置</span></button>
        <button class="nav-btn" type="button" data-type="cfgpage"><span class="ni-ico">📑</span><span class="ni-tx">页面配置</span></button>
        <button class="nav-btn" type="button" data-type="cfgext"><span class="ni-ico">🧪</span><span class="ni-tx">扩展功能</span></button>
      </nav>
      <div class="nav-foot" id="navFoot">
        <a class="nav-link" href="https://github.com/slepoh/Firefly-Admin" target="_blank" rel="noopener" title="GitHub 开源地址">
          <span class="ni-ico">🔗</span><span class="ni-tx">开源地址</span>
        </a>
      </div>
      <!-- PC 端二级菜单容器（配置分类 / 站点资源等） -->
      <div class="sub-nav" id="subNav" hidden>
        <div class="sub-nav-head">
          <span class="sub-nav-title" id="subNavTitle">菜单</span>
        </div>
        <div class="sub-nav-scroll cfg-nav-scroll" id="subNavScroll"></div>
      </div>
    </aside>

    <!-- 右侧主区域：内容列表 / 编辑器（同一时刻仅显示一个） -->
    <section class="main-area" id="mainArea">

      <!-- 内容列表视图：显示选中板块的内容，可批量删除、单独编辑/重命名/删除、新建 -->
      <div class="content-view" id="contentView">
        <div class="content-toolbar">
          <label class="ct-selectall" id="selectAllRow">
            <input type="checkbox" id="selectAll" /> 全选
          </label>
          <div class="ct-title" id="ctTitle">文章内容</div>
          <div class="ct-actions">
            <button id="batchDelBtn" class="btn danger sm">🗑 批量删除</button>
            <button id="newBtn" class="btn primary sm">＋ 新建</button>
            <button id="topRefreshBtn" class="btn ghost sm" title="刷新当前列表">⟳ 刷新</button>
            <button id="quickUploadBtn" class="btn ghost sm" title="上传资源到仓库">📤 上传资源</button>
            <button id="newCatBtn" class="btn ghost sm" title="在当前目录下新建分类 / 文件夹">📁 新建分类</button>
          </div>
        </div>
        <div class="list-tools">
          <button id="upDirBtn" class="btn ghost sm" hidden>↑ 上级</button>
          <input type="text" id="searchInput" placeholder="搜索文件名…" />
          <button id="refreshBtn" class="btn ghost sm" title="刷新列表">⟳</button>
        </div>
        <div class="file-list" id="fileList"></div>
        <div class="crumb" id="crumb"></div>

        <!-- 资源上传：清晰的拖拽区，默认折叠，点击标题展开 -->
        <div class="meta-panel collapsed" id="uploadPanel">
          <button type="button" class="panel-head">📤 资源上传 <span class="chev">▾</span></button>
          <div class="panel-body">
            <div class="upload-drop" id="uploadDrop">
              <div class="ud-icon">⬆</div>
              <div class="ud-text">拖拽文件到此处，或</div>
              <button type="button" class="btn primary block" id="pickBtn">＋ 选择文件</button>
              <input type="file" id="fileInput" multiple hidden />
            </div>
            <div class="up-hint">自动上传到 <code>public/uploads</code></div>
            <div class="up-list" id="upList"></div>
          </div>
        </div>
      </div>

      <!-- 配置视图：PC 端二级菜单在 sidebar#subNav；移动端保留内部 cfg-nav（保持不变） -->
      <div class="config-view" id="configView" hidden>
        <aside class="cfg-nav" id="cfgNav">
          <div class="cfg-nav-head">
            <span class="cfg-nav-title">配置分类</span>
          </div>
          <div class="cfg-nav-scroll" id="cfgNavScroll"></div>
        </aside>
        <section class="cfg-content" id="cfgContent">
          <div class="cfg-readme" id="cfgReadme"><div class="cfg-readme-empty">加载操作说明…</div></div>
          <div id="cfgPanes"></div>
          <!-- 站点资源：Logo（深/浅两套）与作者头像，从「站点外观」合并而来 -->
          <div class="cfg-resource" id="cfgResource" hidden>
            <div class="res-pane" data-pane="logo">
              <div class="ap-group">
                <div class="ap-group-title">站点 Logo</div>
                <div class="ap-cards">
                  <div class="ap-card">
                    <div class="ap-preview"><img id="prevLogoDark" alt="深色 Logo" /></div>
                    <div class="ap-name">深色 Logo</div>
                    <button class="btn ghost sm ap-btn" type="button" data-pick="logo-dark">更换</button>
                    <input type="file" class="ap-file" data-asset="logo-dark" accept="image/*" hidden />
                  </div>
                  <div class="ap-card">
                    <div class="ap-preview"><img id="prevLogoLight" alt="浅色 Logo" /></div>
                    <div class="ap-name">浅色 Logo</div>
                    <button class="btn ghost sm ap-btn" type="button" data-pick="logo-light">更换</button>
                    <input type="file" class="ap-file" data-asset="logo-light" accept="image/*" hidden />
                  </div>
                </div>
              </div>
            </div>
            <div class="res-pane" data-pane="avatar" hidden>
              <div class="ap-group">
                <div class="ap-group-title">作者头像</div>
                <div class="ap-cards">
                  <div class="ap-card">
                    <div class="ap-preview ap-preview--round"><img id="prevAvatar" alt="作者头像" /></div>
                    <div class="ap-name">avatar.webp</div>
                    <button class="btn ghost sm ap-btn" type="button" data-pick="avatar">更换</button>
                    <input type="file" class="ap-file" data-asset="avatar" accept="image/*" hidden />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- 编辑区 -->
      <div class="editor" id="editorPane" hidden>
        <div class="empty-state" id="emptyState">
          <div class="big">🗂️</div>
          <p>从左侧选择文件进行编辑，或点击「新建」创建内容。</p>
        </div>

        <div class="edit-form" id="editForm" hidden>
          <!-- 顶部操作栏：返回 / 删除 / 保存 -->
          <div class="edit-topbar">
            <button id="backBtn" class="btn ghost">← 返回</button>
            <span class="ab-spacer"></span>
            <button id="deleteBtn" class="btn danger" hidden>🗑 删除</button>
            <button id="saveBtn" class="btn primary">💾 保存</button>
          </div>

          <div class="editor-head">
            <span class="eh-icon" id="ehIcon">📝</span>
            <div class="eh-meta">
              <div class="fn-row">
                <input type="text" id="fileName" class="filename" placeholder="文件名（不含后缀）" />
                <select id="extSelect" class="ext-select" aria-label="文件后缀" title="选择文件后缀"></select>
              </div>
              <div class="eh-path" id="ehPath"></div>
            </div>
            <div class="eh-right">
              <span class="ed-type-badge" id="edTypeBadge">Markdown 富文本</span>
              <div class="edit-status" id="editStatus"></div>
            </div>
          </div>

          <!-- 文章结构化表单（可折叠，默认收起以最大化编辑区） -->
          <div class="meta-panel collapsed" id="postPanel" hidden>
            <button type="button" class="panel-head">📋 文章信息 <span class="lock-badge" id="encBadge" hidden>🔒 已加密</span> <span class="chev">▾</span></button>
            <div class="panel-body"><div id="postFields" class="post-fields"></div></div>
          </div>

          <!-- 动态字段（可折叠） -->
          <div class="meta-panel collapsed" id="dynamicPanel" hidden>
            <button type="button" class="panel-head">⚡ 动态信息 <span class="chev">▾</span></button>
            <div class="panel-body">
              <div id="dynamicFields" class="dynamic-fields">
                <div class="field">
                  <label>发布时间</label>
                  <input type="datetime-local" id="dynPublished" />
                </div>
                <div class="field">
                  <label>地点 (location，可选)</label>
                  <input type="text" id="dynLocation" placeholder="如 郑州" />
                </div>
              </div>
            </div>
          </div>

          <!-- 编辑模式切换 -->
          <div class="mode-switch" id="modeSwitch">
            <span>编辑模式：</span>
            <button class="seg active" id="modeRich" data-mode="rich">富文本</button>
            <button class="seg" id="modeRaw" data-mode="raw">源代码</button>
          </div>

          <!-- 编辑主区 -->
          <div class="editor-main" id="editorMain">
            <div class="editor-host" id="editorHost">
              <div id="editor"></div>
            </div>
          </div>

          <!-- 源代码模式：整文件编辑 -->
          <textarea id="rawEditor" class="raw-editor" hidden placeholder="编辑完整文件（含 Frontmatter）…"></textarea>

          <!-- 结构化配置编辑：参数名锁定，仅值可编辑 -->
          <div id="configEditor" class="config-editor" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 右键菜单 -->
  <div class="ctx-menu" id="ctxMenu" hidden></div>
  <input type="file" id="ctxFileInput" multiple hidden />

  <!-- 提示条 -->
  <div class="toast" id="toast" hidden></div>

  <!-- 保存成功弹窗（自动消失） -->
  <div class="ok-popup" id="okPopup" hidden></div>

  <script src="/vendor/toastui/toastui-editor-all.min.js"></script>
  <script src="/config-parser.js"></script>
  <script src="/app.js"></script>
</body>
</html>
